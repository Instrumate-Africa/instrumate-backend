services:
  pgdb:
    container_name: instrumate_postgres_db
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PSQL_DB_USER}
      POSTGRES_DB: ${PSQL_DB_NAME}
      POSTGRES_PASSWORD: ${PSQL_DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PSQL_DB_USER} -d ${PSQL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    # networks:
    #   - instrumate_network

    ports:
      - "${PSQL_DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: .
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # networks:
    #   - instrumate_network
    depends_on:
      pgdb:
        condition: service_healthy

# networks:
#   instrumate_network:
#     external: true
#     name: instrumate_shared_network
#
volumes:
  pg_data:
  redis_data:
