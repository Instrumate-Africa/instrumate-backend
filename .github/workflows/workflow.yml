name: Test and Build API Image

on:
  pull_request:
    types: [opened, synchronized, reopened]

  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r instrumate/requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret
        run: |
          cd instrumate
          python manage.py test

  build-docker:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        env:
          NAMESPACE: instrumate-africa
          IMAGE_NAME: ia-backend
          VERSION: latest
        uses: docker/build-push-action@v6
        with:
          context: ./instrumate
          push: true
          tags: |
            ghcr.io/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ghcr.io/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
